<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Desk</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="locked">
  <div id="gate" class="gate">
    <section class="signin">
      <div class="signin-stage">
        <p class="mark">The Desk</p>
        <h1>A private concierge<br />for Pune.</h1>
        <p class="signin-copy">Tell us who you are once. Bookings use this name, email, and mobile until you log out.</p>
      </div>
      <div class="signin-panel">
        <p class="panel-kicker">Guest profile</p>
        <h2>Before you chat</h2>
        <form id="guest-form" class="guest-form">
          <label class="sr-only" for="guest-name">Full name</label>
          <input id="guest-name" name="name" type="text" maxlength="80" placeholder="Full name" autocomplete="name" required />
          <label class="sr-only" for="guest-email">Email</label>
          <input id="guest-email" name="email" type="email" maxlength="120" placeholder="Email" autocomplete="email" required />
          <label class="sr-only" for="guest-phone">Mobile</label>
          <input id="guest-phone" name="phone" type="tel" inputmode="numeric" maxlength="15" placeholder="10-digit mobile" autocomplete="tel" required />
          <button type="submit">Enter the desk</button>
        </form>
        <p id="gate-error" class="gate-error"></p>
      </div>
    </section>
  </div>

  <div class="desk">
    <header class="topbar">
      <p class="brand">The Desk</p>
      <div id="account" class="account" hidden>
        <span id="account-name"></span>
        <button type="button" id="logout">Log out</button>
      </div>
    </header>
    <section id="thread" class="thread" aria-live="polite"></section>
    <p id="blank" class="blank">Ask about a stay in Pune.</p>
    <form id="chat-form" class="composer">
      <label class="sr-only" for="message">Message</label>
      <textarea id="message" name="message" maxlength="4000" rows="1" placeholder="Write a message"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </div>
  <div id="lightbox" class="lightbox" hidden>
    <button type="button" id="lightbox-close" class="lightbox-close">Close</button>
    <img id="lightbox-image" alt="" />
    <p id="lightbox-caption"></p>
  </div>
  <script src="/static/chat.js"></script>
</body>
</html>
